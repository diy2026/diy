  * {box-sizing: border-box;}

  .cover-stage {

  /* ===== 贴纸操作按钮：默认隐藏，悬停/选中时显示（与装饰控件一致） =====

  /* 贴纸右下角拉伸/缩放手柄：同样默认隐藏，悬停/选中显示 */

  /* ===== 工具栏通用控件：统一高度与对齐 ===== */
  .tgroup{ display:flex; flex-direction:column; gap:6px; min-width:0; border-radius:8px; transition:background .15s ease, box-shadow .15s ease; }
  /* 点选画布文字时，上方对应设置组高亮 */
  .tgroup.selected{ background:#eef4ff; box-shadow:0 0 0 2px rgba(64,128,255,.4); }

  .trow{ display:flex; align-items:center; gap:8px; min-width:0; height:28px; }
  .tname{ font-size:11px; color:#6b7280; flex:none; }
  .tval{ font-size:11px; color:#374151; font-weight:600; flex:none; text-align:right; }

  .tswatch{ width:28px; height:28px; border:1px solid #d1d5db; border-radius:6px; padding:2px; background:#fff; cursor:pointer; }
  .tswatch-wrap{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .tswatch-name{ font-size:10px; color:#9ca3af; }
  .tbtn{ height:28px; border:1px solid #e5e7eb; border-radius:6px; font-size:11px; color:#4b5563; padding:0 10px; background:#fff; transition:all .15s ease; white-space:nowrap; }
  .tbtn:hover{ background:#eff6ff; border-color:#4080ff; color:#4080ff; }

  /* ===== 文字样式预设：下拉框旁的色点预览（主色+描边圆环） ===== */
  .style-preset-dot{ width:14px; height:14px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12); }

  /* ===== 背景类型切换按钮与预设色板 ===== */
  .bg-mode-btn{ height:28px; border:1px solid #e5e7eb; border-radius:6px; font-size:11px; color:#4b5563; background:#fff; transition:all .15s ease; }
  .bg-mode-btn:hover{ border-color:#4080ff; color:#4080ff; }
  .bg-mode-btn.active{ background:#4080ff; border-color:#4080ff; color:#fff; }
  .bg-swatch{ aspect-ratio:1/1; border-radius:6px; border:1px solid rgba(0,0,0,.12); cursor:pointer; transition:transform .12s ease, box-shadow .12s ease; }
  .bg-swatch:hover{ transform:scale(1.12); }
  .bg-swatch.active{ box-shadow:0 0 0 2px #4080ff; }

  /* ===== 画布下方紧凑功能条：位置 / 滤镜 / 操作 ===== */
  .pos-btn{ height:24px; min-width:34px; padding:0 5px; font-size:10px; border:1px solid #e5e7eb; border-radius:5px; background:#fff; color:#4b5563; transition:all .15s ease; white-space:nowrap; }
  .pos-btn:hover{ background:#eff6ff; border-color:#4080ff; color:#4080ff; }
  .brow{ display:flex; align-items:center; gap:6px; height:24px; font-size:10px; color:#6b7280; white-space:nowrap; }
  .brow b{ font-size:10px; color:#374151; font-weight:600; min-width:30px; text-align:right; }

  /* ===== 文字拖拽命中框（透明层） ===== */
  .text-hit{ cursor:grab; }
  .text-hit:active{ cursor:grabbing; }

  /* ===== 装饰条右下角拖拽调整大小手柄 =====
     加大面积并提高层级：必须压在 ctrl-top/ctrl-bottom 操作条之上，
     否则下方操作按钮会挡住手柄导致无法拉伸 */
  .resize-handle{
    position:absolute; right:-8px; bottom:-8px; width:16px; height:16px;
    background:#4080ff; border:2px solid #fff; border-radius:4px;
    cursor:nwse-resize; box-shadow:0 1px 4px rgba(0,0,0,.3);
    touch-action:none;
    z-index:40;
  }

  /* ===== 装饰：锚点 + 独立混合层 =====
     叠底(mix-blend-mode)必须加在无隔离的元素上才能与背景图混合：
     锚点元素不带transform/z-index，混合层单独包裹图形，编辑控件不参与混合 */
  .decor-item{ position:absolute; cursor:move; pointer-events:auto; touch-action:none; width:0; height:0; padding:0; border:0; }
  .decor-item.active .shape-wrap{ outline:2px dashed #4080ff; outline-offset:3px; border-radius:4px; }
  .shape-wrap{ position:absolute; left:0; top:0; white-space:nowrap; transform-origin:center center; }
  .shape-wrap.blend-multiply{ mix-blend-mode:multiply; }
  .ctrl-top,.ctrl-bottom{ position:absolute; display:flex; gap:4px; align-items:center; pointer-events:auto; z-index:30; }
  .blend-label{ display:flex; align-items:center; gap:2px; font-size:10px; color:#4b5563; background:#fff; border:1px solid #e5e7eb; border-radius:4px; padding:0 3px; height:20px; cursor:pointer; user-select:none; }

  /* ===== 画布内编辑控件：默认隐藏，悬停或选中时显示 ===== */
  .decor-item .ctrl-top,
  .decor-item .ctrl-bottom{ display:none; }
  .decor-item .resize-handle,
  .text-hit .resize-handle{ display:none; }
  .decor-item:hover .ctrl-top,
  .decor-item:hover .ctrl-bottom,
  .decor-item.active .ctrl-top,
  .decor-item.active .ctrl-bottom{ display:flex; }
  .decor-item:hover .resize-handle,
  .decor-item.active .resize-handle,
  .text-hit:hover .resize-handle,
  .text-hit.active .resize-handle{ display:block; }
